# Zenities-style lock. Background path is updated when the wallpaper changes.

background {
    monitor =
    path = /home/ping/.config/wallpapers/28.jpg
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 0.9
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(236, 228, 220, 0.96)
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B"
    color = rgba(236, 228, 220, 0.62)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(236, 228, 220, 0.28)
    inner_color = rgba(16, 10, 12, 0.42)
    font_color = rgba(245, 240, 236, 1.0)
    fade_on_empty = true

    check_color = rgba(170, 210, 170, 0.85)
    fail_color = rgba(210, 80, 90, 0.9)

    placeholder_text = <span foreground="##c9bbb4"><i>password</i></span>
    position = 0, -90
    halign = center
    valign = center
}
