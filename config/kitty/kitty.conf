include kitty-colors.conf

# --- Shell Configuration ---
shell fish

# --- Font Settings ---
# JetBrainsMono + 13pt + 80% opacity is the Ghostty look from
# https://github.com/ViegPhunt/Dotfiles
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
modify_font      cell_height 118%

# --- Window Layout & Appearance ---
# Padding only — margin stacked an extra empty frame around the text.
window_padding_width 12 18 14 18
window_margin_width 0
background_opacity 0.80
dynamic_background_opacity yes
confirm_os_window_close 0
hide_window_decorations yes

allow_remote_control yes
listen_on unix:/tmp/kitty

# --- Cursor ---
# Beam caret with a long ease blink, then a fire trail on jumps (new line,
# prompt redraw, nvim motions). Threshold 3/1 so typing one character does
# not spark, but a newline always does.
cursor_shape beam
cursor_shape_unfocused hollow
cursor_beam_thickness 2.2
cursor_blink_interval 0.45 ease-in-out
cursor_stop_blinking_after 0
cursor_text_color background
cursor_trail 1
cursor_trail_decay 0.05 0.32
cursor_trail_start_threshold 3 1
custom_shaders cursor-trail-blaze

# --- Keybindings ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
